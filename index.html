<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="A simple, modern, and user-friendly Budget Splitter & Expense Tracker for students, individuals, and friends. Track expenses, set monthly budgets, split group bills with friends, and calculate who owes whom.">
  <meta name="theme-color" content="#10b981">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <title>BudgetSplit - Expense Tracker & Bill Splitter</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💸</text></svg>">
</head>
<body>
  <!-- Root React App Container -->
  <div id="root">
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; font-family: sans-serif; color: #64748b;">
      <div style="width: 48px; height: 48px; border: 4px solid #e2e8f0; border-top-color: #10b981; border-radius: 50%; animation: spin 1s linear infinite;"></div>
      <p style="font-weight: 500;">Loading BudgetSplit...</p>
      <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
    </div>
  </div>

  <!-- React 18 & ReactDOM (CDN with graceful fallback) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js" crossorigin></script>

  <!-- Local Offline React Fallback (activates automatically if offline or CDN is blocked) -->
  <script src="react-fallback.js"></script>

  <!-- Application Logic -->
  <script src="app.js"></script>

  <!-- Service Worker Registration for PWA & Offline Access -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('BudgetSplit ServiceWorker registered successfully:', reg.scope))
          .catch(err => console.log('ServiceWorker registration skipped (normal on file://):', err));
      });
    }
  </script>
</body>
</html>
